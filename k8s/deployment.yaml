apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
        - name: notes-app
          # Pulled through the in-cluster registry (same pattern as the other apps); Jenkins bumps the tag.
          image: localhost:30600/notes-app:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: notes-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-db-secret
                  key: POSTGRES_PASSWORD
          # Ready only when the database answers; a database outage stops traffic but does not restart the pod.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
